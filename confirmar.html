<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AMDC FC · Confirmar presença</title>
<style>
:root{--navy:#131C47;--navy-3:#25338C;--royal:#2E46B8;--royal-soft:#E7EBF9;--ice:#F2F4F9;--line:#DCE1EE;--muted:#5D6688;
  --good:#1D8657;--good-soft:#E2F3EA;--bad:#BF3A2C;--bad-soft:#FBE8E5}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--navy);background:var(--navy);min-height:100vh}
.wrap{max-width:460px;margin:0 auto;padding:20px 16px 40px}
.top{display:flex;align-items:center;gap:12px;color:#fff;margin-bottom:16px}
.top img{width:52px;height:auto}
.top h1{font-size:19px;margin:0;letter-spacing:.3px}
.top p{margin:2px 0 0;font-size:13px;opacity:.8}
.card{background:#fff;border-radius:16px;padding:18px;margin-bottom:14px}
.jogo .lbl{font-size:12px;font-weight:700;color:var(--royal);text-transform:uppercase;letter-spacing:.6px}
.jogo .vs{font-size:22px;font-weight:800;margin:4px 0}
.jogo .meta{color:var(--muted);font-size:14.5px;line-height:1.5}
h2{font-size:16px;margin:0 0 10px}
.hint{color:var(--muted);font-size:13.5px;margin:0 0 12px}
.busca{width:100%;height:46px;border:1.5px solid var(--line);border-radius:12px;padding:0 14px;font-size:16px;margin-bottom:10px}
.nomes{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.nomes button{min-height:46px;border:1.5px solid var(--line);background:#fff;border-radius:12px;font-size:15px;font-weight:600;color:var(--navy);padding:6px 8px;cursor:pointer;text-align:center}
.nomes button small{display:block;font-size:11.5px;font-weight:600;margin-top:2px}
.nomes button.vou small{color:var(--good)} .nomes button.nao small{color:var(--bad)}
.eu{font-size:20px;font-weight:800;margin:0 0 4px}
.resp{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.resp button{height:62px;border-radius:14px;border:2px solid transparent;font-size:18px;font-weight:800;cursor:pointer}
.b-vou{background:var(--good);color:#fff} .b-nao{background:var(--bad-soft);color:var(--bad);border-color:#F1C6C0 !important}
.resp button.atual{outline:4px solid var(--royal);outline-offset:2px}
.trocar{background:none;border:none;color:var(--royal);font-size:14px;font-weight:600;padding:10px 0 0;cursor:pointer;text-decoration:underline}
.ok{background:var(--good-soft);color:#14583A;border-radius:12px;padding:14px;font-size:15.5px;font-weight:600;margin-top:14px}
.err{background:var(--bad-soft);color:#7A2117;border-radius:12px;padding:14px;font-size:15px}
.lista{font-size:14px;color:var(--muted);line-height:1.6}
.lista b{color:var(--navy)}
.hidden{display:none !important}
</style>
</head>

  <div id="carregando" class="card">Carregando o jogo…</div>
  <div id="erro" class="card err hidden"></div>
  <div id="jogo" class="card jogo hidden"></div>
  <div id="passo-nome" class="card hidden">
    <h2>1. Toque no seu nome</h2>
    <p class="hint">Só aparecem os atletas do elenco. Não achou seu nome? Fale com a diretoria.</p>
    <input class="busca" id="busca" type="search" placeholder="Procurar nome…" autocomplete="off">
    <div class="nomes" id="nomes"></div>
  </div>
  <div id="passo-resp" class="card hidden">
    <h2>2. Você vai ao jogo?</h2>
    <p class="eu" id="eu"></p>
    <div class="resp"><button class="b-vou" data-resp="vou">✅ Vou</button><button class="b-nao" data-resp="nao">❌ Não vou</button></div>
    <div id="feito" class="ok hidden"></div>
    <button class="trocar" id="trocar">Não é você? Escolher outro nome</button>
  </div>
  <div id="quem" class="card hidden"></div>
</div>
<script>
const TOKEN = (new URLSearchParams(location.search).get("c") || "").replace(/[^A-Za-z0-9_-]/g, "").slice(0, 64);
const LS = "amdc_atleta_id";
let dados = null, eu = null;
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const DIAS = ["domingo", "segunda", "terça", "quarta", "quinta", "sexta", "sábado"];
function dataLonga(iso) {
  if (!iso) return "Data a definir";
  const p = iso.split("-"), d = new Date(+p[0], +p[1] - 1, +p[2]);
  return DIAS[d.getDay()] + ", " + p[2] + "/" + p[1];
}
function chamar(fn, ...args) {
  return new Promise((ok, falha) => {
    google.script.run.withSuccessHandler(ok).withFailureHandler(e => falha(e))[fn](...args);
  });
}
function erro(msg) {
  $("#carregando").classList.add("hidden");
  ["#jogo", "#passo-nome", "#passo-resp", "#quem"].forEach(s => $(s).classList.add("hidden"));
  $("#erro").textContent = msg; $("#erro").classList.remove("hidden");
}
function rotuloResp(r) { return r === "vou" ? "✅ vai" : r === "nao" ? "❌ não vai" : ""; }
function render() {
  const j = dados.jogo;
  $("#carregando").classList.add("hidden");
  $("#jogo").innerHTML = `<div class="lbl">${esc(j.rotulo)}</div><div class="vs">${j.mando === "fora" ? "@ " : "vs "}${esc(j.adversario || "Adversário a definir")}</div>
    <div class="meta">📅 ${esc(dataLonga(j.data))}${j.hora ? " · " + esc(j.hora) : ""}${j.local ? "<br>📍 " + esc(j.local) : ""}</div>`;
  $("#jogo").classList.remove("hidden");
  if (dados.encerrado) { erro("Este jogo já foi disputado. A confirmação está encerrada."); $("#jogo").classList.remove("hidden"); return; }
  const meu = eu && dados.atletas.find(a => a.id === eu);
  $("#passo-nome").classList.toggle("hidden", !!meu);
  $("#passo-resp").classList.toggle("hidden", !meu);
  if (meu) {
    $("#eu").textContent = meu.nome;
    document.querySelectorAll(".resp button").forEach(b => b.classList.toggle("atual", b.dataset.resp === meu.resp));
    $("#feito").classList.toggle("hidden", !meu.resp);
    $("#feito").innerHTML = meu.resp === "vou" ? "Presença confirmada! Obrigado. Se mudar de ideia, é só tocar em <b>Não vou</b>."
      : meu.resp === "nao" ? "Ok, avisamos a diretoria que você não vai. Se mudar de ideia, toque em <b>Vou</b>." : "";
  } else renderNomes();
  const vao = dados.atletas.filter(a => a.resp === "vou").map(a => a.nome);
  $("#quem").innerHTML = `<h2>Quem já confirmou (${vao.length})</h2><div class="lista">${vao.length ? vao.map(n => "<b>" + esc(n) + "</b>").join(", ") : "Ninguém ainda. Seja o primeiro!"}</div>`;
  $("#quem").classList.remove("hidden");
}
function renderNomes() {
  const q = $("#busca").value.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().trim();
  const lista = dados.atletas.filter(a => !q || a.nome.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().includes(q));
  $("#nomes").innerHTML = lista.map(a => `<button data-id="${esc(a.id)}" class="${a.resp}">${esc(a.nome)}${a.resp ? `<small>${rotuloResp(a.resp)}</small>` : ""}</button>`).join("") || `<p class="hint">Nenhum nome encontrado.</p>`;
}
async function carregar() {
  try {
    const r = JSON.parse(await chamar("api_convite", TOKEN));
    if (!r.ok) return erro("Este link de confirmação não é válido ou foi substituído por um novo. Peça o link atualizado no grupo.");
    dados = r;
    try { eu = localStorage.getItem(LS); } catch (e) {}
    render();
  } catch (e) { erro("Não foi possível carregar agora. Verifique a internet e abra o link de novo."); }
}
document.addEventListener("click", async e => {
  const nome = e.target.closest("#nomes button");
  if (nome) { eu = nome.dataset.id; try { localStorage.setItem(LS, eu); } catch (x) {} render(); window.scrollTo(0, 0); return; }
  if (e.target.closest("#trocar")) { eu = null; try { localStorage.removeItem(LS); } catch (x) {} render(); return; }
  const b = e.target.closest(".resp button");
  if (b) {
    const resp = b.dataset.resp, bts = document.querySelectorAll(".resp button");
    bts.forEach(x => { x.disabled = true; });
    try {
      await chamar("api_confirmar", TOKEN, eu, resp);
      const a = dados.atletas.find(x => x.id === eu); if (a) a.resp = resp;
      render();
    } catch (err) {
      const m = String((err && err.message) || err);
      if (m.includes("JOGO_ENCERRADO")) dados.encerrado = true, render();
      else alert(m.includes("CONVITE_INVALIDO") ? "Este link foi substituído. Peça o link novo no grupo." : "Não foi possível salvar. Tente de novo.");
    } finally { bts.forEach(x => { x.disabled = false; }); }
  }
});
$("#busca").addEventListener("input", renderNomes);
carregar();
</script>
